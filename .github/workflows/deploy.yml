name: CI/CD Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Node and NPM
        run: |
          node -v
          npm -v

      - name: Setup pnpm
        run: |
          npm install -g pnpm@9.15.0
          pnpm -v

      - name: Install dependencies and build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          mv dist/ deno-deploy

      - name: Archive build artifacts
        run: |
          tar -czvf legacy-intellectualfrontiers.tar.gz deno-deploy

      - name: Copy build artifacts to the production server
        run: |
          scp -P22 -o StrictHostKeyChecking=no legacy-intellectualfrontiers.tar.gz "${{ secrets.PRODUCTION_DEPLOYMENT_USER }}@${{ secrets.PRODUCTION_DEPLOYMENT_SERVER_IP }}:"

      - name: Deploy to production server
        run: |
          ssh -p22 -o StrictHostKeyChecking=no -t ${{ secrets.PRODUCTION_DEPLOYMENT_USER }}@${{ secrets.PRODUCTION_DEPLOYMENT_SERVER_IP }} "bash -i legacy-intellectual-frontiers.sh"



